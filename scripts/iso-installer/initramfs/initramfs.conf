# initramfs-tools configuration for the take-home installer's initramfs
# (mkinitramfs -d). Every block driver, so the installer sees the owner's disks
# and the stick it booted from; no busybox, so the installer's tools are the
# ones the hook copies from the system it installs.
MODULES=most
BUSYBOX=n
KEYMAP=n
COMPRESS=zstd
RUNSIZE=10%
FSTYPE=auto
