# The take-home installer's boot menu (CHG-0075), for BIOS and UEFI alike:
# GRUB for BIOS reads it from the ISO's prefix, and Debian's signed GRUB for CDs
# finds the ISO by /.disk/info and sources it.
set timeout=10
set default=0
terminal_output console

menuentry "Install the Deevnet take-home backend (erases the disk you choose)" {
	linux /live/vmlinuz boot=deevnet-install quiet console=ttyS0,115200n8 console=tty0
	initrd /live/initrd.img
}

menuentry "Power off" {
	halt
}
