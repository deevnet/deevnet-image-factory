# tenant2backend - first boot on a VM (CHG-0074): the settings come from the
# console (backend-setup), not a boot partition. If setup fails, first
# boot does not run, and the next boot asks again.
[Unit]
Requires=backend-setup.service
After=backend-setup.service backend-growroot.service

[Service]
ExecStart=
ExecStart=/usr/local/bin/tenant2backend init --config /etc/backend/backend.txt
