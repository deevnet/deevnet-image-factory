# deevnet-kit - first boot on a VM (CHG-0074): the settings come from the
# console (deevnet-kit-setup), not a boot partition. If setup fails, first
# boot does not run, and the next boot asks again.
[Unit]
Requires=deevnet-kit-setup.service
After=deevnet-kit-setup.service deevnet-kit-growroot.service

[Service]
ExecStart=
ExecStart=/usr/local/bin/deevnet-kit init --config /etc/deevnet-kit/deevnet-kit.txt
