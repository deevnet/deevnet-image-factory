# deevnet-kit - the broker, as Deevnet's is seen from outside: TLS on 8883
# only, no anonymous clients, and nothing permitted that the ACL file does
# not grant. The password and ACL files are rendered by deevnet-kit; manage
# accounts with `deevnet-kit account`.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/deevnet-kit/passwd
acl_file /etc/mosquitto/deevnet-kit/acl

listener 8883
certfile /etc/deevnet-kit/tls/server.pem
keyfile /etc/deevnet-kit/tls/server-key.pem
