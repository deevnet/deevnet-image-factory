# tenant2backend - the broker, as Deevnet's is seen from outside: TLS on 8883
# only, no anonymous clients, and nothing permitted that the ACL file does
# not grant. The password and ACL files are rendered by tenant2backend; manage
# accounts with `tenant2backend account`.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/backend/passwd
acl_file /etc/mosquitto/backend/acl

listener 8883
certfile /etc/backend/tls/server.pem
keyfile /etc/backend/tls/server-key.pem
