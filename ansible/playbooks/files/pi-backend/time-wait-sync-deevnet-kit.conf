# deevnet-kit - wait for NTP at boot, for 90 seconds at most (CHG-0056).
#
# A Pi has no clock battery. Without this, time-sync.target is reached before
# the clock is set, and Grafana and first boot start on whatever time the card
# booted with. Unbounded, a Pi with no NTP server in reach would never start
# them; so it gives up after 90 seconds, and that is not a failure: the card
# goes on with the time fake-hwclock restored, which is never earlier than the
# day the image was built.
[Service]
ExecStart=
ExecStart=-/usr/bin/timeout 90 /usr/lib/systemd/systemd-time-wait-sync
TimeoutStartSec=120
