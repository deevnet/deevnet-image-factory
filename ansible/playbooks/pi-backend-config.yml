---
# Raspberry Pi take-home backend image (OFFLINE)
#
# A mini Deevnet on an SD card. A tenant prototypes on Deevnet at a meetup,
# then flashes this image onto its own card and moves its app across: the Pi
# keeps the same app contract (MQTT over TLS on 8883 with the tenant's topic
# prefix and the reserved log level, the log store's tokens and partition
# selector on 8427) with no Deevnet API, no Terraform and no Deevnet access.
#
#   mosquitto            the broker (TLS only), accounts via `tenant2backend account`
#   victorialogs         the log store, loopback only
#   vmauth               the log store's front door, users rendered by deevnet-log-user
#   deevnet-log-bridge   <tenant>/log/<device> -> the tenant's device partition
#   grafana              the tenant's dashboards on 3000, organization and data
#                        sources written by `tenant2backend dashboards` (CHG-0024)
#   vmstorage, vminsert, the metrics store, loopback only, behind vmauth (CHG-0072)
#   vmselect
#   vmalert@<tenant>     the tenant's alert rules, imported from its Terraform
#   alertmanager         routes the tenant's alerts to its ntfy topics
#   ntfy                 the phone's alerts, TLS on 443 (CHG-0072)
#   silo                 the bucket store, TLS on 9000; disabled until the first
#                        `tenant2backend bucket add` (CHG-0073)
#   tenant2backend       first boot, accounts, status (from deevnet-provisioning-api)
#   deevnet-pki-owner.sh the starter kit for a PKI of the owner's own, which
#                        `tenant2backend pki` runs (ADR-0041 §3; deevnet.mgmt scripts/pki)
#   podman               for the tenant's own app
#
# NOTHING SECRET IS BAKED IN. The CA, certificates, tokens and passwords are
# made on the card at first boot, so two cards share nothing. And NOTHING OF
# DEEVNET'S STAYS: the a_autoprov user the shared Packer step adds is removed
# at the end of this play. The card belongs to whoever flashed it.
#
# Two media, one play (CHG-0074). medium=pi (the default) configures a
# Raspberry Pi OS card; medium=vm configures Debian's bookworm nocloud image as
# an amd64 virtual machine. Everything above is the same on both; what differs
# is how the owner's settings arrive (the card's boot partition, or the console
# through tenant2backend setup) and what the base image lacks or leaves open.
#
# Usage (from Makefile):
#   sudo ansible-playbook -i ansible/inventories/local.yml ansible/playbooks/pi-backend-config.yml \
#     --extra-vars "chroot_root=/mnt/pi-bookworm-image pi_backend_inputs=/path/to/build/pi-backend \
#                   pki_tools_src=/path/to/ansible-collection-deevnet.mgmt/scripts/pki pki_tools_ref=<commit>"

- name: Configure Pi take-home backend image (offline)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    # REQUIRED: passed in from Makefile
    chroot_root: "{{ chroot_root | default(omit) }}"
    pi_backend_inputs: "{{ pi_backend_inputs | default(omit) }}"

    image_name: "{{ 'vm' if backend_vm else 'pi' }}-backend-bookworm"

    # pi or vm; extra-vars medium=vm from `make vm-backend`.
    backend_medium: "{{ medium | default('pi') }}"
    backend_vm: "{{ backend_medium == 'vm' }}"
    # apt across the core router, in KB/s; 0 is no limit.
    backend_apt_dl_limit: "{{ apt_dl_limit | default(0) }}"

    # Staged by the Makefile from the artifact server.
    pi_backend_binaries:
      - tenant2backend
      - deevnet-log-user
      - deevnet-log-bridge
      - victoria-logs-prod
      - vmauth-prod
      - vmalert-prod
      - vmstorage-prod
      - vminsert-prod
      - vmselect-prod
      - alertmanager
      - ntfy
      - silo

    pi_backend_packages:
      - mosquitto
      - mosquitto-clients
      - podman
      - avahi-daemon
      # The owner's root key stick (deevnet-pki-media.sh): LUKS2. The -bin
      # package has no initramfs hooks; the root filesystem is not encrypted.
      - cryptsetup-bin

    # What Debian's nocloud image lacks that a Pi's has: SSH, and the tool
    # backend-growroot uses. The guest agent lets a hypervisor shut the VM
    # down cleanly and see its address.
    vm_backend_packages:
      - openssh-server
      - cloud-guest-utils
      - qemu-guest-agent

    pi_backend_units:
      - backend-ssh-hostkeys.service
      - backend-firstboot.service
      - victorialogs.service
      - vmauth.service
      - deevnet-log-bridge.service
      - grafana.service
      - backend-dashboards.service
      - backend-selftest.service
      - vmstorage.service
      - vminsert.service
      - vmselect.service
      - alertmanager.service
      - ntfy.service
      - deevnet-alerting-sync.path
      - backend-alerting.service

    vm_backend_units:
      - backend-setup.service
      - backend-growroot.service

    # Grafana and its VictoriaLogs plugin: the release tarball and the plugin
    # zip, checksum-verified by the Makefile before this play runs. The same
    # Grafana and plugin versions as Deevnet's (deevnet.mgmt grafana role).
    pi_backend_grafana_tarball: "{{ pi_backend_inputs }}/grafana.tar.gz"
    pi_backend_grafana_plugin_zip: "{{ pi_backend_inputs }}/grafana-plugin.zip"
    pi_backend_grafana_plugin_id: victoriametrics-logs-datasource

  pre_tasks:
    - name: Assert chroot_root and pi_backend_inputs provided
      ansible.builtin.assert:
        that:
          - chroot_root is defined
          - chroot_root | length > 1
          - pi_backend_inputs is defined
          - pi_backend_inputs | length > 1
          - pki_tools_src is defined
          - pki_tools_ref is defined
        fail_msg: >
          chroot_root and pi_backend_inputs must be set
          (e.g. --extra-vars "chroot_root=/mnt/pi-bookworm-image pi_backend_inputs=$PWD/build/pi-backend")

    - name: Assert we look like a mounted rootfs
      ansible.builtin.stat:
        path: "{{ chroot_root }}/etc/os-release"
      register: osrel

    - name: Fail if mounted rootfs not found
      ansible.builtin.assert:
        that:
          - osrel.stat.exists
        fail_msg: "No /etc/os-release at {{ chroot_root }} — is the image mounted?"

    - name: Fail on an unknown medium
      ansible.builtin.assert:
        that: backend_medium in ['pi', 'vm']
        fail_msg: "medium must be pi or vm, not {{ backend_medium }}"

    - name: Check the Grafana inputs are present
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ pi_backend_grafana_tarball }}"
        - "{{ pi_backend_grafana_plugin_zip }}"
      register: pi_backend_grafana_inputs

    - name: Fail if a Grafana input is missing
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing {{ item.item }} — run make pi-backend-inputs"
        quiet: true
      loop: "{{ pi_backend_grafana_inputs.results }}"
      loop_control:
        label: "{{ item.item | basename }}"

    - name: Check every staged binary is present
      ansible.builtin.stat:
        path: "{{ pi_backend_inputs }}/{{ item }}"
      loop: "{{ pi_backend_binaries }}"
      register: pi_backend_binary_stat

    - name: Fail if a staged binary is missing
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing {{ item.item }} in {{ pi_backend_inputs }} — run make pi-backend-inputs"
        quiet: true
      loop: "{{ pi_backend_binary_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

  tasks:
    - name: Create marker file to verify provisioning
      ansible.builtin.copy:
        dest: "{{ chroot_root }}/etc/packer-provisioned"
        content: |
          Image: {{ image_name }}
          Build Date: {{ ansible_date_time.iso8601 }}
          Ansible Version: {{ ansible_version.full }}
        mode: "0644"
        owner: root
        group: root

    # ------------------------------------------------------------
    # Packages (chroot)
    # ------------------------------------------------------------
    # Installing mosquitto in a chroot does not start it (invoke-rc.d sees no
    # running systemd), and it enables its unit; the drop-in below holds it
    # back until first boot has written its configuration.
    - name: Update apt cache inside chroot
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} /usr/bin/apt-get -o Acquire::http::Dl-Limit={{ backend_apt_dl_limit }} update"
      changed_when: true

    - name: Install broker, container runtime and mDNS inside chroot
      ansible.builtin.command:
        cmd: >-
          chroot {{ chroot_root }} /usr/bin/apt-get -o Acquire::http::Dl-Limit={{ backend_apt_dl_limit }} install -y
          {{ (pi_backend_packages + (vm_backend_packages if backend_vm else [])) | join(' ') }}
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true

    - name: Clean apt cache inside chroot
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} /usr/bin/apt-get clean"
      changed_when: true

    # ------------------------------------------------------------
    # Service users
    # ------------------------------------------------------------
    # backend is the group that may read the server's TLS key; mosquitto
    # and vmauth's user are its only members.
    - name: Create the TLS key group
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} groupadd --system backend"
      register: pi_backend_groupadd
      changed_when: pi_backend_groupadd.rc == 0
      failed_when: pi_backend_groupadd.rc not in [0, 9]  # 9 = exists

    - name: Create the log store's user
      ansible.builtin.command:
        cmd: >-
          chroot {{ chroot_root }} useradd --system --user-group --no-create-home
          --home-dir /var/lib/victoria-logs --shell /usr/sbin/nologin victoria
      register: pi_backend_useradd
      changed_when: pi_backend_useradd.rc == 0
      failed_when: pi_backend_useradd.rc not in [0, 9]  # 9 = exists

    - name: Create Grafana's user
      ansible.builtin.command:
        cmd: >-
          chroot {{ chroot_root }} useradd --system --user-group --no-create-home
          --home-dir /var/lib/grafana --shell /usr/sbin/nologin grafana
      register: pi_backend_useradd_grafana
      changed_when: pi_backend_useradd_grafana.rc == 0
      failed_when: pi_backend_useradd_grafana.rc not in [0, 9]  # 9 = exists

    # The metrics store, and alerting's three (CHG-0072). Each its own user.
    - name: Create the metrics store's and alerting's users
      ansible.builtin.command:
        cmd: >-
          chroot {{ chroot_root }} useradd --system --user-group --no-create-home
          --home-dir /nonexistent --shell /usr/sbin/nologin {{ item }}
      loop:
        - victoriametrics
        - vmalert
        - alertmanager
        - ntfy
        - silo
      register: pi_backend_useradd_alerting
      changed_when: pi_backend_useradd_alerting.rc == 0
      failed_when: pi_backend_useradd_alerting.rc not in [0, 9]  # 9 = exists

    - name: Let mosquitto, the log store, Grafana, ntfy and silo read the TLS key
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} usermod -aG backend {{ item }}"
      loop:
        - mosquitto
        - victoria
        - grafana
        - ntfy
        - silo
      changed_when: true

    # deevnet-log-user runs as victoria and writes alerting's files 0640;
    # vmalert, Alertmanager and ntfy read them as members of its group, as
    # vmalert does on Deevnet (CHG-0071).
    - name: Let vmalert, Alertmanager and ntfy read the writer's files
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} usermod -aG victoria {{ item }}"
      loop:
        - vmalert
        - alertmanager
        - ntfy
      changed_when: true

    - name: Create the writer's vmalert directory
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} install -d -o victoria -g victoria -m 0755 /var/lib/backend /var/lib/backend/vmalert"
      changed_when: true

    # ------------------------------------------------------------
    # Binaries
    # ------------------------------------------------------------
    - name: Install the staged binaries
      ansible.builtin.copy:
        src: "{{ pi_backend_inputs }}/{{ item }}"
        dest: "{{ chroot_root }}/usr/local/bin/{{ item }}"
        mode: "0755"
        owner: root
        group: root
      loop: "{{ pi_backend_binaries }}"

    # The tool's name before ADR-0045, for one release: called by it, the tool
    # says its new name. Remove in the release after.
    - name: Keep deevnet-kit as a link to tenant2backend
      ansible.builtin.file:
        src: tenant2backend
        dest: "{{ chroot_root }}/usr/local/bin/deevnet-kit"
        state: link
        force: true

    # ------------------------------------------------------------
    # The starter PKI (ADR-0041 §3, CHG-0056)
    # ------------------------------------------------------------
    # The owner's tools only: Deevnet's own ceremony (deevnet-pki-ceremony.sh,
    # deevnet-pki-sign.sh, deevnet-pki.cnf) is the pi-pki image's, not this one's.
    - name: Install the owner PKI tools
      ansible.builtin.copy:
        src: "{{ pki_tools_src }}/{{ item }}"
        dest: "{{ chroot_root }}/usr/local/sbin/{{ item }}"
        mode: "0755"
        owner: root
        group: root
      loop:
        - deevnet-pki-owner.sh
        - deevnet-pki-media.sh

    - name: Create the PKI profile directory
      ansible.builtin.file:
        path: "{{ chroot_root }}/usr/local/share/deevnet-pki"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Install the owner PKI profile
      ansible.builtin.copy:
        src: "{{ pki_tools_src }}/deevnet-pki-owner.cnf"
        dest: "{{ chroot_root }}/usr/local/share/deevnet-pki/deevnet-pki-owner.cnf"
        mode: "0644"
        owner: root
        group: root

    - name: Record which tools the image carries
      ansible.builtin.copy:
        dest: "{{ chroot_root }}/usr/local/share/deevnet-pki/RELEASE"
        content: "tools={{ pki_tools_ref }}\n"
        mode: "0644"
        owner: root
        group: root

    # ------------------------------------------------------------
    # Grafana (CHG-0024)
    # ------------------------------------------------------------
    # Unpacked on the build host rather than in the chroot: tar and Python run
    # natively, and nothing here needs to execute arm64 code.
    - name: Create Grafana's directories
      ansible.builtin.file:
        path: "{{ chroot_root }}{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
        owner: root
        group: root
      loop:
        - {path: /opt/grafana, mode: "0755"}
        - {path: /var/lib/grafana-plugins, mode: "0755"}

    - name: Unpack Grafana into /opt/grafana
      ansible.builtin.command:
        argv: [tar, -xzf, "{{ pi_backend_grafana_tarball }}", -C, "{{ chroot_root }}/opt/grafana",
               --strip-components=1, --no-same-owner]
      changed_when: true

    # Root-owned and not writable by Grafana: the service loads this code and
    # cannot change it. zipfile does not restore modes, so the backend
    # binaries are made executable here. Every platform's backend is kept:
    # the signed manifest lists them all, and a missing file fails the
    # signature check.
    - name: Unpack the VictoriaLogs data source plugin
      ansible.builtin.command:
        argv: [python3, -m, zipfile, -e, "{{ pi_backend_grafana_plugin_zip }}", "{{ chroot_root }}/var/lib/grafana-plugins"]
      changed_when: true

    - name: Make the plugin readable, and its backends executable
      ansible.builtin.shell: |
        set -eu
        d={{ (chroot_root ~ '/var/lib/grafana-plugins/' ~ pi_backend_grafana_plugin_id) | quote }}
        chown -R root:root "$d"
        find "$d" -type d -exec chmod 0755 {} +
        find "$d" -type f -exec chmod 0644 {} +
        find "$d" -type f -name 'victoriametrics_logs_backend_plugin_*' -exec chmod 0755 {} +
      changed_when: true

    # Grafana writes its database and logs here, and nowhere else.
    - name: Create Grafana's data and log directories
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} install -d -o grafana -g grafana -m 0750 /var/lib/grafana /var/log/grafana"
      changed_when: true

    # ------------------------------------------------------------
    # Configuration
    # ------------------------------------------------------------
    - name: Create configuration directories
      ansible.builtin.file:
        path: "{{ chroot_root }}{{ item }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      loop:
        - /etc/deevnet
        - /etc/mosquitto/conf.d
        - /etc/systemd/system/mosquitto.service.d
        - /opt/backend/examples

    - name: Install configuration files
      ansible.builtin.copy:
        src: "files/pi-backend/{{ item.src }}"
        dest: "{{ chroot_root }}{{ item.dest }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - {src: mosquitto-backend.conf, dest: /etc/mosquitto/conf.d/backend.conf}
        - {src: mosquitto-override.conf, dest: /etc/systemd/system/mosquitto.service.d/backend.conf}
        - {src: log-user.json, dest: /etc/deevnet/log-user.json}
        - {src: my-app.service, dest: /opt/backend/examples/my-app.service}
        - {src: backend-ssh-hostkeys.service, dest: /etc/systemd/system/backend-ssh-hostkeys.service}
        - {src: backend-firstboot.service, dest: /etc/systemd/system/backend-firstboot.service}
        - {src: victorialogs.service, dest: /etc/systemd/system/victorialogs.service}
        - {src: vmauth.service, dest: /etc/systemd/system/vmauth.service}
        - {src: deevnet-log-bridge.service, dest: /etc/systemd/system/deevnet-log-bridge.service}
        - {src: grafana.service, dest: /etc/systemd/system/grafana.service}
        - {src: backend-dashboards.service, dest: /etc/systemd/system/backend-dashboards.service}
        - {src: backend-selftest.service, dest: /etc/systemd/system/backend-selftest.service}
        - {src: vmstorage.service, dest: /etc/systemd/system/vmstorage.service}
        - {src: vminsert.service, dest: /etc/systemd/system/vminsert.service}
        - {src: vmselect.service, dest: /etc/systemd/system/vmselect.service}
        - {src: alertmanager.service, dest: /etc/systemd/system/alertmanager.service}
        - {src: ntfy.service, dest: /etc/systemd/system/ntfy.service}
        - {src: vmalert@.service, dest: /etc/systemd/system/vmalert@.service}
        - {src: deevnet-alerting-sync.path, dest: /etc/systemd/system/deevnet-alerting-sync.path}
        - {src: deevnet-alerting-sync.service, dest: /etc/systemd/system/deevnet-alerting-sync.service}
        - {src: backend-alerting.service, dest: /etc/systemd/system/backend-alerting.service}
        # Installed, not enabled: tenant2backend enables it with the first bucket.
        - {src: silo.service, dest: /etc/systemd/system/silo.service}
        - {src: README.txt, dest: /opt/backend/README.txt}
        # Replaces Debian's licence notice: the first thing the owner sees on
        # login is where to start.
        - {src: motd, dest: /etc/motd}

    - name: Install the alerting sync script
      ansible.builtin.copy:
        src: files/pi-backend/deevnet-alerting-sync
        dest: "{{ chroot_root }}/usr/local/sbin/deevnet-alerting-sync"
        mode: "0755"
        owner: root
        group: root

    # The boot partition is FAT, so the owner can set the tenant from any
    # laptop after flashing. The partition is mounted at /boot here and at
    # /boot/firmware when the Pi runs.
    - name: Put the tenant settings on the boot partition
      ansible.builtin.copy:
        src: files/pi-backend/backend.txt
        dest: "{{ chroot_root }}/boot/backend.txt"
        mode: "0644"
      when: not backend_vm

    # Beside backend.txt, so the instructions are readable from any laptop
    # the moment the card is flashed - the owner edits that file before the
    # first boot, and this says what to put in it. Also in /opt/backend.
    - name: Put the instructions on the boot partition
      ansible.builtin.copy:
        src: files/pi-backend/README.txt
        dest: "{{ chroot_root }}/boot/README.txt"
        mode: "0644"
      when: not backend_vm

    # ------------------------------------------------------------
    # A VM (CHG-0074): the console in place of the boot partition
    # ------------------------------------------------------------
    - name: Install the VM's instructions, setup, growroot and first boot units
      ansible.builtin.copy:
        src: "files/vm-backend/{{ item.src }}"
        dest: "{{ chroot_root }}{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
        owner: root
        group: root
      loop:
        - {src: README.txt, dest: /opt/backend/README.txt}
        - {src: backend-setup.service, dest: /etc/systemd/system/backend-setup.service}
        - {src: backend-growroot.service, dest: /etc/systemd/system/backend-growroot.service}
        - {src: backend-growroot, dest: /usr/local/sbin/backend-growroot, mode: "0755"}
        - {src: 50-backend-dhcp.network, dest: /etc/systemd/network/50-backend-dhcp.network}
      when: backend_vm

    - name: Create first boot's drop-in directory
      ansible.builtin.file:
        path: "{{ chroot_root }}/etc/systemd/system/backend-firstboot.service.d"
        state: directory
        mode: "0755"
      when: backend_vm

    - name: First boot reads what setup wrote, and waits for it
      ansible.builtin.copy:
        src: files/vm-backend/backend-firstboot-vm.conf
        dest: "{{ chroot_root }}/etc/systemd/system/backend-firstboot.service.d/vm.conf"
        mode: "0644"
      when: backend_vm

    - name: Enable the services
      ansible.builtin.file:
        src: "/etc/systemd/system/{{ item }}"
        dest: "{{ chroot_root }}/etc/systemd/system/multi-user.target.wants/{{ item }}"
        state: link
        force: true
      loop: "{{ pi_backend_units + (vm_backend_units if backend_vm else []) }}"

    # ------------------------------------------------------------
    # The clock (CHG-0056)
    # ------------------------------------------------------------
    # A Pi has no clock battery: fake-hwclock restores the time it saved at
    # the last shutdown, which on a new card is whatever the base image left,
    # a year in the past. The build's own time instead, so a card never starts
    # before the day its image was built, with or without a network.
    - name: Start every card's clock at the build's time
      ansible.builtin.copy:
        dest: "{{ chroot_root }}/etc/fake-hwclock.data"
        content: "{{ now(utc=true, fmt='%Y-%m-%d %H:%M:%S') }}\n"
        mode: "0644"
        owner: root
        group: root
      # A VM has the hypervisor's clock.
      when: not backend_vm

    # time-sync.target then means the clock is set, for 90 seconds at most;
    # Grafana and first boot start after it.
    - name: Create the time-wait-sync drop-in directory
      ansible.builtin.file:
        path: "{{ chroot_root }}/etc/systemd/system/systemd-time-wait-sync.service.d"
        state: directory
        mode: "0755"

    - name: Bound the wait for NTP
      ansible.builtin.copy:
        src: files/pi-backend/time-wait-sync-backend.conf
        dest: "{{ chroot_root }}/etc/systemd/system/systemd-time-wait-sync.service.d/backend.conf"
        mode: "0644"

    - name: Enable the wait for NTP
      ansible.builtin.file:
        src: /lib/systemd/system/systemd-time-wait-sync.service
        dest: "{{ chroot_root }}/etc/systemd/system/sysinit.target.wants/systemd-time-wait-sync.service"
        state: link
        force: true

    - name: Check mosquitto is enabled by its package
      ansible.builtin.stat:
        path: "{{ chroot_root }}/etc/systemd/system/multi-user.target.wants/mosquitto.service"
      register: pi_backend_mosquitto_enabled

    - name: Fail if mosquitto is not enabled
      ansible.builtin.assert:
        that: pi_backend_mosquitto_enabled.stat.exists
        fail_msg: "mosquitto.service was not enabled by its package; the broker would not start"

    # ------------------------------------------------------------
    # Hand-off: nothing of Deevnet's stays on the card
    # ------------------------------------------------------------
    # Last, so nothing above depends on the user. The owner's own
    # login comes from userconf.txt on the boot partition, on first boot.
    - name: Remove the automation user and its home
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} userdel --remove a_autoprov"
      register: pi_backend_userdel
      changed_when: pi_backend_userdel.rc == 0
      failed_when: pi_backend_userdel.rc not in [0, 6]  # 6 = no such user

    - name: Remove the automation user's sudo rule
      ansible.builtin.file:
        path: "{{ chroot_root }}/etc/sudoers.d/010_a_autoprov-nopasswd"
        state: absent

    - name: Look for anything of the automation user's left behind
      ansible.builtin.shell:
        cmd: >-
          grep -l a_autoprov {{ chroot_root }}/etc/passwd {{ chroot_root }}/etc/shadow
          {{ chroot_root }}/etc/group {{ chroot_root }}/etc/sudoers.d/* 2>/dev/null;
          ls -d {{ chroot_root }}/home/a_autoprov 2>/dev/null; true
      register: pi_backend_leftovers
      changed_when: false

    # Every card would otherwise present the SSH identity of the image it was
    # flashed from. backend-ssh-hostkeys.service makes new ones on first
    # boot.
    - name: Remove the SSH host keys the image was built with
      ansible.builtin.shell:
        cmd: "rm -f {{ chroot_root }}/etc/ssh/ssh_host_*"
      changed_when: true

    - name: Fail if the automation user is still on the card
      ansible.builtin.assert:
        that: pi_backend_leftovers.stdout | length == 0
        fail_msg: "a_autoprov is still in the image: {{ pi_backend_leftovers.stdout_lines }}"

    # ------------------------------------------------------------
    # Hand-off on a VM (CHG-0074): what Debian's nocloud image leaves open
    # ------------------------------------------------------------
    # nocloud lets root sign in with no password, for testing images. The
    # owner's login comes from tenant2backend setup on the console; root has none.
    - name: Lock root's password
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} usermod --password '!' root"
      changed_when: true
      when: backend_vm

    - name: Read root's password field
      ansible.builtin.command:
        cmd: "awk -F: '$1 == \"root\" {print $2}' {{ chroot_root }}/etc/shadow"
      register: vm_backend_root_pw
      changed_when: false
      when: backend_vm

    - name: Fail if root can sign in with a password
      ansible.builtin.assert:
        that: vm_backend_root_pw.stdout is match('^[!*]')
        fail_msg: "root's password field is {{ vm_backend_root_pw.stdout | length }} characters and not locked"
      when: backend_vm

    # Empty, so systemd makes a new one on first boot: two VMs from this image
    # must not share an identity, which DHCP and mDNS both key on.
    - name: Empty the machine ID
      ansible.builtin.copy:
        dest: "{{ chroot_root }}/etc/machine-id"
        content: ""
        mode: "0444"
        owner: root
        group: root
      when: backend_vm

    - name: Remove D-Bus's copy of the machine ID
      ansible.builtin.file:
        path: "{{ chroot_root }}/var/lib/dbus/machine-id"
        state: absent
      when: backend_vm
