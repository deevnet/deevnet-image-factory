---
# Render Proxmox API credentials for one hypervisor into a shell env file.
#
# The credentials live in the Deevnet inventory (host_vars/<host>/vault.yml) and
# are surfaced here as TF_VAR_proxmox_* so Packer picks them up via env(). This
# keeps the token out of shell history and out of this repo.
#
# Invoked by the Makefile's pve1-env / pve2-env / proxmox-fedora-pve* targets;
# it is not usually run by hand. If you do:
#
#   ansible-playbook -i ../ansible-inventory-deevnet/dvntm \
#     ansible/playbooks/pve-env.yml \
#     -e pve_host=hv02 -e pve_node=pve2 -e pve_env_file=build/pve-env/pve2.env
#
# connection: local because nothing runs on the hypervisor - we only need its
# inventory vars, and the file is written here on the build host.
- name: Render Proxmox credentials for the image factory
  hosts: "{{ pve_host }}"
  connection: local
  gather_facts: false

  vars:
    pve_api_port: 8006

  tasks:
    - name: Assert the required variables were supplied
      ansible.builtin.assert:
        that:
          - pve_node is defined and pve_node | length > 0
          - pve_env_file is defined and pve_env_file | length > 0
        fail_msg: "pve_node and pve_env_file must both be passed with -e"
        quiet: true

    - name: Assert this host carries Proxmox API credentials
      ansible.builtin.assert:
        that:
          - proxmox_token_id is defined and proxmox_token_id | length > 0
          - proxmox_token_secret is defined and proxmox_token_secret | length > 0
        fail_msg: >-
          {{ inventory_hostname }} has no proxmox_token_id / proxmox_token_secret.
          Check host_vars/{{ inventory_hostname }}/vault.yml in the inventory,
          and that the vault is readable (ansible-vault password available).
        quiet: true

    # no_log: the token secret would otherwise be echoed in the task diff.
    - name: Write the environment file
      ansible.builtin.copy:
        dest: "{{ pve_env_file }}"
        mode: "0600"
        content: |
          # Generated by ansible/playbooks/pve-env.yml - do not commit.
          # Source: {{ inventory_hostname }} ({{ ansible_host }}) in the Deevnet inventory.
          export TF_VAR_proxmox_url="https://{{ ansible_host }}:{{ pve_api_port }}/api2/json"
          export TF_VAR_proxmox_node="{{ pve_node }}"
          export TF_VAR_proxmox_token_id="{{ proxmox_token_id }}"
          export TF_VAR_proxmox_token_secret="{{ proxmox_token_secret }}"
      no_log: true
